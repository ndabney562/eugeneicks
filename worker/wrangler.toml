# Cloudflare Worker configuration for EUGENEICKS Online Leaderboard
# Enforces $0 free-tier constraints (Workers free plan + D1 free tier; no paid overages)
name = "eugeneicks-leaderboard"
main = "index.ts"
compatibility_date = "2026-10-26"

# Free tier usage limits:
# Workers: 100,000 requests/day
# D1: 5M row reads/day, 100k row writes/day, 5 GB storage

[[d1_databases]]
binding = "DB"
database_name = "eugeneicks-leaderboard-db"
database_id = "8ed71044-3eea-4b6e-83e8-c824b67f9c64"
